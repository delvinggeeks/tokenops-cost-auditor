# Validates the JS/TS packages (sdk/js, action) — a Node toolchain separate from the
# Python app, so it only runs when those packages change. Not (yet) a required check.
name: js-packages

on:
  pull_request:
    paths:
      - "sdk/js/**"
      - "action/**"
      - ".github/workflows/sdk-js.yml"
  push:
    branches: [main]
    paths:
      - "sdk/js/**"
      - "action/**"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ["sdk/js", "action"]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: typecheck (strict)
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
