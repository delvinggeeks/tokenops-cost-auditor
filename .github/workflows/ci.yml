# CI per docs/05-TEST-PLAN.md §4:
# lint -> type -> unit+integration (postgres service) -> coverage gate -> build image
# perf: nightly only. deploy: manual.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # nightly perf run (T-PERF-01)
  workflow_dispatch:

jobs:
  # Clean-authorship law (CLAUDE.md rule 6; founder 2026-07-24). A HARD gate so
  # it holds for automated / loop-engineering commits too: every commit in the
  # PR is authored by the founder with no AI trailer/reference. Pure stdlib, no
  # deps — runs in parallel with lint.
  authorship:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the commit range resolves
      - name: clean-authorship law (Lokesh only, no AI trace)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="origin/main..HEAD"
          fi
          echo "authorship range: $RANGE"
          python3 scripts/check_authorship.py "$RANGE"

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    needs: type
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokenops_cost_auditor
          POSTGRES_PASSWORD: tokenops_cost_auditor
          POSTGRES_DB: tokenops_cost_auditor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenops_cost_auditor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tokenops_cost_auditor:tokenops_cost_auditor@localhost:5432/tokenops_cost_auditor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: weasyprint system libraries (PDF rendering, D7)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 fonts-dejavu-core
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov=src/tokenops_cost_auditor --cov-report=json --cov-report=term -m "not perf"
      - name: coverage gate (85% services, 100% money math)
        run: uv run python scripts/coverage_gate.py
      - name: pricing table age (NFR-15 — warns, never fails)
        run: uv run python scripts/pricing_age.py
      - name: strict pricing verification (R-AUTO-PRICING — fails the build)
        run: uv run python scripts/pricing_verify.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tokenops-cost-auditor:ci .

  docs:
    # D-DOCS (DOCS-PLAN §1): OpenAPI drift gate, then zero-warning strict build
    runs-on: ubuntu-latest
    needs: type
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras
      - name: API reference drift gate (MP-3)
        run: uv run python scripts/export_openapi.py --check
      - name: self-audit ledger drift gate (WP-SELF)
        run: uv run python scripts/render_self_audit.py --check
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  perf:
    # T-PERF-01 (NFR-04): nightly only per docs/05 §4
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokenops_cost_auditor
          POSTGRES_PASSWORD: tokenops_cost_auditor
          POSTGRES_DB: tokenops_cost_auditor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenops_cost_auditor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tokenops_cost_auditor:tokenops_cost_auditor@localhost:5432/tokenops_cost_auditor_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras
      # exit code 5 (no tests collected) is success until the perf suite lands at D12
      - run: uv run pytest -m perf || { rc=$?; [ "$rc" -eq 5 ] && echo "no perf tests yet"; [ "$rc" -eq 5 ]; }

  deploy:
    # manual per docs/05 §4; real procedure is runbook §2 (wired at D13)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - run: echo "Manual deploy placeholder — see docs/06-OPS-RUNBOOK.md §2 (D13)."
