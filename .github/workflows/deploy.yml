# WP-DEVOPS-OBS: the deploy pipeline. workflow_dispatch IS the founder's
# "approved to deploy" — pressing the button is the approval ritual, and
# nothing here runs without it. The pipeline then enforces mechanically
# what the runbook asked of humans: CI-green on the tag, strict pricing
# verification (R-AUTO-PRICING), pre-deploy backup, provision, smoke —
# and rolls back to the previously deployed tag if smoke fails.
#
# Required repository secrets (founder-lane, one-time):
#   DEPLOY_SSH_KEY   private key authorized for root@<host>
#   DEPLOY_HOST      169.58.44.80
#   DEPLOY_DOMAIN    tokenops-cost-auditor.com

name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (e.g. v1.7.0)"
        required: true

concurrency: production-deploy  # one deploy at a time, ever

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: full chain on the exact tag
        run: |
          set -o pipefail
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m "not perf"
      - name: strict pricing verification (R-AUTO-PRICING)
        run: uv run python scripts/pricing_verify.py

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0  # provision ships the tag via git archive
      - name: ssh setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: record rollback target (currently deployed tag)
        id: rollback
        run: |
          PREV=$(ssh "root@${{ secrets.DEPLOY_HOST }}" \
            'grep "^RELEASE_TAG=" /opt/tokenops-cost-auditor/.env | cut -d= -f2' || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "rollback target: ${PREV:-<none recorded>}"
      - name: pre-deploy backup
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            'docker exec tokenops-cost-auditor-postgres /bin/bash /scripts/backup.sh'
      - name: provision ${{ inputs.tag }}
        run: |
          bash scripts/provision.sh \
            --host "${{ secrets.DEPLOY_HOST }}" \
            --domain "${{ secrets.DEPLOY_DOMAIN }}" \
            --tag "${{ inputs.tag }}"
      - name: external smoke (fails the job -> triggers rollback)
        run: |
          curl -sSf -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}/healthz" | grep -q '"ok":true'
      - name: rollback on failed smoke
        if: failure() && steps.rollback.outputs.prev != ''
        run: |
          echo "smoke failed — rolling back to ${{ steps.rollback.outputs.prev }}"
          git checkout -q "${{ steps.rollback.outputs.prev }}"
          bash scripts/provision.sh \
            --host "${{ secrets.DEPLOY_HOST }}" \
            --domain "${{ secrets.DEPLOY_DOMAIN }}" \
            --tag "${{ steps.rollback.outputs.prev }}"
          curl -sSf -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}/healthz"
