# The deploy pipeline. LE-2 + staging tier (founder 2026-07-24): build → STAGING
# → smoke → PRODUCTION. Every merge to main auto-promotes through staging first;
# prod only ever ships what staging just proved. No human gate — staging IS the
# gate. workflow_dispatch stays as the manual escape hatch.
#
# Environments (repo Settings → Environments), each with its OWN secrets:
#   staging     DEPLOY_HOST=169.58.69.81   DEPLOY_DOMAIN=staging.tokenops-cost-auditor.com
#   production  DEPLOY_HOST=169.58.44.80   DEPLOY_DOMAIN=tokenops-cost-auditor.com
#   (DEPLOY_SSH_KEY set in BOTH environments — same key, authorized on both hosts)

name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag/ref to deploy (e.g. v1.7.0 or main)"
        required: true
  push:
    branches: [main]

concurrency: production-deploy # one promotion at a time, ever

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"; TAG="${{ inputs.tag }}"
          else
            REF="${{ github.sha }}"; TAG="${{ github.sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "promoting ref=$REF tag=$TAG (event=${{ github.event_name }})"

  gate:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --all-extras
      - name: full chain on the exact ref
        run: |
          set -o pipefail
          uv run ruff check .
          uv run mypy
          uv run pytest -q -m "not perf"
      - name: strict pricing verification (R-AUTO-PRICING)
        run: uv run python scripts/pricing_verify.py

  deploy-staging:
    needs: [resolve, gate]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - name: ssh setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: provision staging
        run: |
          bash scripts/provision.sh \
            --host "${{ secrets.DEPLOY_HOST }}" \
            --domain "${{ secrets.DEPLOY_DOMAIN }}" \
            --tag "${{ needs.resolve.outputs.tag }}"
      - name: smoke staging (a failure here BLOCKS production)
        run: |
          curl -sSf -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}/healthz" | grep -q '"ok":true'

  deploy-production:
    needs: [resolve, gate, deploy-staging] # prod only runs if staging is green
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - name: ssh setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: record rollback target (currently deployed tag)
        id: rollback
        run: |
          PREV=$(ssh "root@${{ secrets.DEPLOY_HOST }}" \
            'grep "^RELEASE_TAG=" /opt/tokenops-cost-auditor/.env | cut -d= -f2' || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "rollback target: ${PREV:-<none recorded>}"
      - name: pre-deploy backup
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            'docker exec tokenops-cost-auditor-postgres /bin/bash /scripts/backup.sh'
      - name: provision production
        run: |
          bash scripts/provision.sh \
            --host "${{ secrets.DEPLOY_HOST }}" \
            --domain "${{ secrets.DEPLOY_DOMAIN }}" \
            --tag "${{ needs.resolve.outputs.tag }}"
      - name: external smoke (fails the job -> triggers rollback)
        run: |
          curl -sSf -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}/healthz" | grep -q '"ok":true'
      - name: rollback on failed smoke
        if: failure() && steps.rollback.outputs.prev != ''
        run: |
          echo "smoke failed — rolling back to ${{ steps.rollback.outputs.prev }}"
          git checkout -q "${{ steps.rollback.outputs.prev }}"
          bash scripts/provision.sh \
            --host "${{ secrets.DEPLOY_HOST }}" \
            --domain "${{ secrets.DEPLOY_DOMAIN }}" \
            --tag "${{ steps.rollback.outputs.prev }}"
          curl -sSf -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}/healthz"
