# TokenOps Cost Auditor — versioned pricing table (FR-05; four rates per founder
# ruling R-Q4: input, output, cache_write, cache_read — USD per 1M tokens).
#
# cache_write semantics (founder correction 2026-07-17):
#   - Anthropic: the 5-minute-TTL cache-write rate (TTL window 300s).
#   - OpenAI GPT-5.6 family: cache writes billed at 1.25x input (official pricing
#     page cache-writes column, re-confirmed 2026-07-17); 30-MINUTE minimum cache
#     life -> D2 est_writes TTL window 1800s for this family.
#   - Other OpenAI families (5.5/5.4/5.3): no write premium — cache_write omitted,
#     defaults to input rate (write premium = 0 in the D2 formula).
# TTL windows are per provider-family in config (D2_TTL_WINDOWS), not global.
#
# effective_from policy (founder to adjust at R-Q3 verification): exact where the
# provider publishes a date; otherwise 2026-06-01 = "verified current as of the
# 2026-07-17 fetch, coverage opened to span typical 30-day audit logs".
# Rate lookups BEFORE a model's first effective_from raise PricingGapError.
#
# Seeded 2026-07-17. FOUNDER-VERIFIED BEFORE G2 per ruling R-Q3.

