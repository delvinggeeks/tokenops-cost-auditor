{# Shared report styling: screen + print. No external assets (NFR-02 posture). #}
<style>
  :root { --accent: #c96442; --ink: #1a1a17; --muted: #6b675f; --bg: #faf9f5; --line: #e5e1d8; }
  * { box-sizing: border-box; }
  body { font-family: "IBM Plex Sans", "Inter", -apple-system, "Segoe UI", sans-serif;
         color: var(--ink); background: var(--bg); margin: 0; line-height: 1.55; }
  .page { max-width: 880px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.9em; }
  .report-header { display: flex; justify-content: space-between; align-items: baseline;
                   border-bottom: 2px solid var(--ink); padding-bottom: 0.75rem; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: 0.01em; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .exec-summary { margin: 2rem 0; }
  .headline-number { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .headline-label { color: var(--muted); margin-top: 0.25rem; }
  .summary-cards { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .card { border: 1px solid var(--line); background: #fff; border-radius: 8px;
          padding: 0.75rem 1rem; flex: 1 1 180px; }
  .card-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
                letter-spacing: 0.04em; }
  .card-value { font-size: 1.35rem; font-weight: 600; margin-top: 0.2rem; }
  .section { margin-top: 2.25rem; }
  h2 { font-size: 1.05rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
  table.bars { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.bars th { text-align: left; color: var(--muted); font-weight: 500;
                  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
                  padding: 0.3rem 0.5rem; }
  table.bars td { padding: 0.3rem 0.5rem; vertical-align: middle; }
  .bar-label { width: 40%; }
  .bar-cell { position: relative; }
  .bar { background: var(--accent); opacity: 0.85; height: 0.9rem; border-radius: 3px;
         display: inline-block; min-width: 2px; vertical-align: middle; }
  .bar-value { margin-left: 0.5rem; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 0.85em; }
  .finding { border: 1px solid var(--line); background: #fff; border-radius: 8px;
             padding: 1rem 1.25rem; margin-top: 1rem; }
  .finding-head { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  .finding-id { font-weight: 700; }
  .finding-impact { margin-left: auto; font-weight: 600; color: var(--accent);
                    font-variant-numeric: tabular-nums; }
  .pill { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
          border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.55rem;
          color: var(--muted); }
  .sev-high .severity { border-color: #b3261e; color: #b3261e; }
  .sev-med .severity { border-color: #a05a00; color: #a05a00; }
  .evidence-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
  .evidence-table th, .evidence-table td { border-top: 1px solid var(--line);
    padding: 0.25rem 0.4rem; text-align: left; }
  .methodology p, .data-handling p { color: var(--ink); font-size: 0.9rem; }
  @page { size: A4; margin: 18mm 15mm; }
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .section { page-break-inside: avoid; }
    .finding { page-break-inside: avoid; }
    .findings, .methodology { page-break-before: auto; }
    details.evidence { display: block; }
    details.evidence summary { list-style: none; }
  }
</style>
