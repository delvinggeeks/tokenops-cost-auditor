# Help registry (PLAN-V15 V-D4g; R-PERSONA + R-CLARITY).
#
# ONE source for: per-widget "?" popovers, in-app Guide pages, section
# purpose lines, and the docs-site pages that mirror them — so popovers and
# docs cannot drift (T-HELP-03).
#
# Threshold values in `why` are written as {placeholders} and rendered from
# live Settings at request time — never hard-coded, so tuning a detector
# threshold updates the help text automatically (T-HELP-06).
#
# R-PERSONA jargon law: `plain` is the ONLY string allowed at headline depth;
# `technical` (detector ids, params) belongs to depth (c) only (T-HELP-04).

destinations:
  overview:
    purpose: "See what your AI spend is costing you and what you have already saved."
  findings:
    purpose: "Work through what is worth fixing, largest dollar impact first."
  reports:
    purpose: "Open or download any past audit, including its full report PDF."
  explore:
    purpose: "Slice your entire history — by time, model, source or finding — and read it as one report."
  breakdown:
    purpose: "See exactly where every token and dollar goes — by model, route and efficiency — the audit-grade tokenomics your finance team can reconcile to the penny."
  runs:
    purpose: "Every audit run end to end — what triggered it, how long each stage took, and what each stage did."
  sources:
    purpose: "Connect a provider so we pull your usage automatically, or revoke one."
  get_logs:
    purpose: "Export request logs from your provider or agent tooling and upload them here."
  alerts:
    purpose: "Choose what should reach you between audits, and at what threshold. Alerts notify you; they never change your traffic."
  statements:
    purpose: "Open the monthly one-page summary written for whoever signs off on the bill."
  guide:
    purpose: "Short walkthroughs of how the audit works and what to do with it."
  activity:
    purpose: "Everything that has happened on your account — audits, alerts, verified savings — newest first."
  settings:
    purpose: "Manage your profile, data controls and email preferences."
  members:
    purpose: "Invite teammates into this workspace and see who's still pending."
  billing:
    purpose: "See your plan, invoices and payment method."
  detectors:
    purpose: "Read exactly what each detector looks for and the thresholds it uses."
  methodology:
    purpose: "Read how every number in your report is calculated."

widgets:
  benchmark:
    title: "How you compare"
    tells: "Your waste share, ranked among real companies — never their numbers, only your place."
    what: "Where your waste share sits among TokenOps customers, as a percentile. Lower is leaner."
    where: "Each company's own audit computes its waste share; we rank yours among them. Only your rank leaves the pool — the figure always says how many companies it is based on."
    do: "High percentile? Your findings list is where the gap closes."
    link: "/guide/benchmarks"
    link_text: "How benchmarks work"
  pipeline:
    title: "Your pipeline, right now"
    tells: "Where your money is in the loop — from logs coming in to alerts watching for the next surprise."
    what: "The five stages of the loop, with live state from your account."
    where: "Stage counts read from your connected sources, your latest audit, your applied findings and your armed alert rules."
    do: "Look for the stage that is waiting — that is where your next minute is best spent."
    link_text: "How TokenOps works"
    link: "/guide/how-it-works"
  verified_savings:
    title: "Verified savings"
    tells: "Money you are no longer spending, recomputed from your own logs after you applied fixes. Not a projection."
    what: "Money you are no longer spending, proven by a later audit of your own logs."
    where: "Each applied finding is recomputed on the next audit covering at least 7 days; the difference, capped at the original estimate, is summed here."
    do: "Apply more findings — each one converts an estimate into a verified number here."
    link_text: "How we verify savings"
    link: "/guide/verified-savings"
  spend_trend:
    title: "Spend trend"
    tells: "What you are paying now versus the last 30 days."
    what: "Daily API spend across every connected source."
    where: "Priced from your provider's reported token counts at our independently verified rate card — machine-checked against published price data on every release — not from your invoice."
    do: "A step change usually means a deploy — compare it against the findings from the same week."
    link_text: "Reading your spend chart"
    link: "/guide/spend-chart"
  forecast:
    title: "Month-end forecast"
    tells: "Where this month's bill is heading — before the invoice, not after."
    what: "Your spend so far this month, projected to month-end at your current pace, against your usual monthly average."
    where: "Projected from complete days this month at our independently verified rate card; the baseline is your prior 90 days. Every figure prints what it was built from."
    do: "If the projection runs well above your usual, that is your cue to look now — we flag it, we never block it."
    link_text: "How the forecast works"
    link: "/guide/forecast"
  waste_share:
    title: "Waste share"
    tells: "How much of that spend our detectors can account for as avoidable."
    what: "The share of spend our detectors can account for as avoidable."
    where: "Sum of every open finding's monthly impact, divided by monthly spend, capped at 100%."
    do: "Set a target in Alerts — we tell you when the line leaves the band."
    link_text: "How waste share is calculated"
    link: "/guide/waste-share"
  top_findings:
    title: "Top findings by monthly impact"
    tells: "The biggest single things worth fixing, ranked by dollars, not severity labels."
    what: "The largest avoidable costs found in your latest audit."
    where: "One row per rule per route, priced at the verified rate card and scaled to 30 days."
    do: "Apply the top one. Its saving is re-verified on your next audit and moves into your headline."
    link_text: "Applying findings"
    link: "/guide/applying-findings"
  sources:
    title: "Sources"
    tells: "Whether we are still receiving your usage data."
    what: "Every provider connection and whether it is still delivering data."
    where: "The last successful pull timestamp for each connection."
    do: "If a source goes stale, reconnect it — the key may have been rotated or revoked."
    link_text: "Managing sources"
    link: "/guide/sources"
  next_audit:
    title: "Next scheduled audit"
    tells: "When these numbers refresh next."
    what: "When your next audit runs."
    where: "Your plan's cadence, counted from the last completed audit."
    do: "Nothing — it runs itself. Apply fixes before it runs and the next audit measures them."
    link_text: "Scheduled audits"
    link: "/guide/scheduled-audits"
  yesterday:
    title: "Yesterday"
    tells: "What yesterday cost, per source, and where the month stands."
    what: "Yesterday's AI spend across your connected sources, and month-to-date."
    where: "Daily usage pulls, priced on the same verified rate card your audits use."
    do: "Set a budget on Alerts and this tile tracks it; the daily email carries the same numbers."
    link_text: "Set a budget line"
    link: "/alerts"
  alerts:
    title: "Recent alerts"
    tells: "Surprises we caught between audits."
    what: "Anything that crossed a threshold you set, between audits."
    where: "Your rules are evaluated hourly against your most recently pulled usage."
    do: "No alerts is the good outcome. Tighten a threshold if you want earlier warning."
    link_text: "Setting up alerts"
    link: "/guide/alerts"
  statement:
    title: "Savings statement"
    tells: "The one-page summary you can forward to whoever signs off on the bill."
    what: "A monthly summary written for someone who never logs in here."
    where: "Verified savings for the month, with estimates labelled as estimates and customer-reported figures kept separate."
    do: "Forward it."
    link_text: "Reading your Savings Statement"
    link: "/guide/savings-statement"

# R-CLARITY §1: depth (c) renders why -> evidence -> fix -> verify -> methodology,
# in that order, for every detector.
detectors:
  d1_oversized_model:
    plain: "You're using a top-tier model for work a cheaper one handles"
    summary: "Everyday requests are running on your most expensive model, when a smaller, cheaper one would handle them just as well. You're paying premium rates for routine work."
    technical: "D1 oversized model"
    why: "Flagged when a frontier model's average completion is under {d1_short_completion_t} tokens — short answers rarely need the largest model. Savings are priced at the suggested model's own rate card."
    fix: "Route this traffic to the suggested model and keep the frontier model for genuinely long generations."
    verify: "Your next audit prices the same routes at the new model; the difference lands in verified savings."
    methodology_url: "/methodology/#d1-oversized-model"
  d2_missing_cache:
    plain: "You're paying full price for prompts you send again and again"
    summary: "Some requests repeat the same large block of text at the start every time. Your provider can store that block and charge a fraction to reuse it — but that caching isn't switched on, so you pay full price for the same text on every call."
    technical: "D2 missing prompt cache"
    why: "Flagged when the same prompt prefix repeats at least {d2_cache_min_repeats} times at {d2_cache_min_prompt_tokens} tokens or more without cache reads. Savings are haircut by {d2_suffix_haircut} for prefix drift."
    fix: "Mark the stable prefix with your provider's cache control so repeat calls read it instead of re-sending it."
    verify: "Your next audit sees cache reads on those calls, and the finding shrinks or disappears."
    methodology_url: "/methodology/#d2-missing-cache"
  d3_prompt_bloat:
    plain: "One route's prompts are far larger than the rest"
    summary: "One part of your app sends much bigger prompts than everywhere else — usually old context or examples that pile up and never get trimmed. You pay for every extra word, on every call."
    technical: "D3 prompt bloat"
    why: "Flagged when a route's average prompt exceeds {d3_bloat_mult}x the median for the same model. The excess is priced at the rate those tokens were actually billed."
    fix: "Trim the system prompt or context growth on that route — usually accumulated examples or unpruned history."
    verify: "Your next audit measures the smaller prompts; the excess disappears from your waste share."
    methodology_url: "/methodology/#d3-prompt-bloat"
  d4_retry_storm:
    plain: "The same request is being sent over and over in bursts"
    summary: "The same request is being sent many times within a few seconds — usually an automatic retry with no limit. Every attempt is billed, so one burst can multiply the cost."
    technical: "D4 retry storm"
    why: "Flagged when {d4_dup_min} or more identical requests land within {d4_window_s} seconds. Requires per-request logs — provider usage APIs report daily totals only."
    fix: "Add backoff and a retry ceiling on that client, and make the retry condition narrower."
    verify: "Your next audit shows the burst gone; the duplicate calls stop appearing."
    methodology_url: "/methodology/#d4-retry-storm"
  d5_unbounded_max_tokens:
    plain: "Your output limits are set far above what you actually use"
    summary: "Your requests allow far longer answers than you ever actually get back. Most providers bill for the words actually generated, so this rarely costs money today — but it leaves the door open to a runaway, very expensive response."
    technical: "D5 unbounded max_tokens"
    why: "Flagged when the declared max_tokens is {d5_max_ratio}x or more your 95th-percentile completion. Informational: most providers bill actual output, so this is a risk signal, not a bill."
    fix: "Set max_tokens close to your real p95 output, with headroom for the longest legitimate answer."
    verify: "Nothing changes on your bill — this protects you from a runaway generation."
    methodology_url: "/methodology/#d5-unbounded-max-tokens"
  d6_chatty_loop:
    plain: "An agent loop is making many tiny calls where fewer would do"
    summary: "An automated loop is firing lots of tiny requests back-to-back. Doing the same work in fewer, larger calls costs less — every call carries fixed overhead you're paying again and again."
    technical: "D6 chatty agent loop"
    why: "Flagged when {d6_loop_min} or more calls under {d6_small_completion_t} completion tokens run inside {d6_run_window_s} seconds. Savings assume batching into groups of {d6_batch_sz}."
    fix: "Batch the loop's work into fewer calls, or cache the repeated context between iterations."
    verify: "Your next audit sees fewer, larger calls on that route and prices the difference."
    methodology_url: "/methodology/#d6-chatty-loop"
  d8_spend_concentration:
    plain: "One route is eating most of your spend"
    summary: "A single part of your app accounts for most of what you spend on LLM calls. It's not waste on its own — but it's where optimizing pays off the most, because the fixes that touch this route move the most money."
    technical: "D8 spend concentration"
    why: "Flagged when one route is at least {d8_concentration_min_share_pct} of total audited spend, across two or more named routes. Informational — no dollar saving is claimed."
    fix: "Start your optimization here — apply the caching, model-sizing and prompt fixes on this route first, since it carries the most dollars."
    verify: "As you optimize this route, its share of spend drops on your next audit and your total spend falls."
    methodology_url: "/methodology/#d8-spend-concentration"
  d9_ineffective_cache:
    plain: "Your prompt caching is costing more than it saves"
    summary: "You've turned on prompt caching, but it isn't paying off — the calls rarely reuse the cached text, so you keep paying the higher write price without getting the read discount back. Right now the caching is a net cost, not a saving."
    technical: "D9 ineffective cache"
    why: "Flagged when a route's cache-write premium exceeds its cache-read savings, over at least {d9_min_cache_write_tokens} cache-write tokens. Computed from the actual billed cache_write and cache_read token counts, so it is conservative, not an estimate."
    fix: "Make the cached prefix stable and ensure repeat calls reuse it within the cache TTL — or stop caching this route. Fewer writes, more reads."
    verify: "Your next audit shows more cache reads (or fewer writes) on this route, and its net cost flips to a saving."
    methodology_url: "/methodology/#d9-ineffective-cache"

wizard:
  # Honest key framing (founder walkthrough 2026-07-22, verified against
  # OpenAI + Anthropic docs): usage & cost data is only available to an
  # organization ADMIN key — there is no usage-only scope, and only an org
  # owner/admin can create one. We say so plainly and pair it with what WE
  # actually do (read-only use, encrypted, revocable). Understating the key's
  # power would fail the first enterprise security review.
  openai:
    provider_name: "OpenAI"
    key_kind: "OpenAI organization Admin key"
    step1_title: "Create an OpenAI Admin key"
    step1_body: "OpenAI exposes usage and cost data only to an organization Admin key — there is no usage-only key (a provider limit, not ours). You'll need to be an org Owner to create one, or ask whoever is. Name it so your team knows what it's for, and we recommend giving it an expiry."
    console_url: "https://platform.openai.com/settings/organization/admin-keys"
    console_note: "This opens OpenAI's real console at platform.openai.com. If it shows an error or an empty page: sign in there first — the Admin-keys page only exists for an OpenAI ORGANIZATION with you as Owner; a personal ChatGPT login doesn't have it. Manual path once signed in: Settings → Organization → Admin keys."
    missing_note: "Signed in but the Admin-keys page is missing or empty? You need the OWNER role on your OpenAI organization — ask whoever owns it to create the key, or to make you an Owner."
    who_can: "Only an OpenAI organization Owner can create this key."
    key_can: "manage your organization — members, projects, and other keys"
    we_do: "call only the read-only usage and cost reports — never your models, never your prompts"
    create_hint: "Name it, set an expiry, create"
    step2_title: "Paste the key here"
    step2_body: "We check it against OpenAI right away and show you exactly what it can read. It's encrypted the moment it arrives, never written to a log, and deleted the instant you revoke it here."
    step3_title: "Connected — the platform takes it from here."
    step3_body: "We pull the last 30 days now, so your dashboard fills within minutes, then refresh your usage once a day. Nothing else for you to do."
  anthropic:
    provider_name: "Anthropic"
    key_kind: "Anthropic organization Admin key"
    step1_title: "Create an Anthropic Admin key"
    step1_body: "Anthropic exposes usage and cost data only to an organization Admin key — there is no usage-only key (a provider limit, not ours). You'll need the Admin role in your Claude org to create one, or ask whoever has it. Name it so your team knows what it's for, and we recommend giving it an expiry."
    console_url: "https://platform.claude.com/settings/admin-keys"
    console_note: "This opens Anthropic's real console — platform.claude.com is Anthropic's own domain (their console moved there from console.anthropic.com). If it shows 'Page not found': sign in there first — the Admin-keys page only exists for a Claude CONSOLE (API) organization with you in the Admin role; a claude.ai chat login alone doesn't have it. Manual path once signed in: Settings → Admin keys."
    missing_note: "Signed in but seeing only 'API keys' and no 'Admin keys'? Your Console account is an individual account — Anthropic provides Admin keys (and the usage reports we read) only to ORGANIZATIONS. Create yours in Settings → Organization (about a minute; you become its Admin) and the Admin keys page appears."
    who_can: "Only a member with the Admin role in your Claude organization can create this key."
    key_can: "manage your organization — members, workspaces, and existing keys"
    we_do: "call only the read-only usage and cost reports — never your models, never your prompts"
    create_hint: "Name it, set an expiry, create"
    step2_title: "Paste the key here"
    step2_body: "We check it against Anthropic right away and show you exactly what it can read. It's encrypted the moment it arrives, never written to a log, and deleted the instant you revoke it here."
    step3_title: "Connected — the platform takes it from here."
    step3_body: "We pull the last 30 days now, so your dashboard fills within minutes, then refresh your usage once a day. Nothing else for you to do."

  azure-openai:
    # WP-CLOUD-T2 C-A. Verified against Microsoft's monitoring reference
    # (2026-07-23): usage lives as Azure Monitor metrics on the Cognitive
    # Services resource; a service principal with ONLY the Monitoring Reader
    # role can read them — read-only by Azure RBAC, not by our promise.
    provider_name: "Azure OpenAI"
    key_kind: "Entra ID service principal with the Monitoring Reader role"
    step1_short: "Grant a read-only service principal in Azure"
    step2_short: "Paste its four values here"
    step1_title: "Grant us read-only eyes on your metrics — Azure enforces it"
    step1_body: "Azure OpenAI publishes token and request counts as Azure Monitor metrics on your resource. We read those metrics with a service principal you create, holding exactly one role: Monitoring Reader, on exactly one resource. Five minutes in the portal:"
    step1_steps:
      - "Microsoft Entra ID → App registrations → New registration. Name it (e.g. tokenops-cost-auditor-reader), register."
      - "Copy the Directory (tenant) ID and Application (client) ID from the overview page."
      - "Certificates & secrets → New client secret. Give it an expiry; copy the secret Value now (Azure shows it once)."
      - "Open your Azure OpenAI resource → Access control (IAM) → Add role assignment → Monitoring Reader → select your new app."
      - "On the resource's Properties page, copy the Resource ID (starts /subscriptions/…)."
    console_url: "https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
    console_label: "Open Azure's App registrations page"
    console_note: "This opens Azure's real portal at portal.azure.com (App registrations). If it shows an error or an empty page: sign in with the account that manages your Azure subscription. Manual path once signed in: Microsoft Entra ID → App registrations."
    missing_note: "Signed in but App registrations is blocked? Your directory restricts who may register apps — ask an Entra admin to create the registration, or to grant you the role."
    who_can: "Anyone with Owner or User Access Administrator on the resource can grant the role."
    key_can: "read monitoring metrics for the one resource you granted — token counts, request counts, by model and deployment"
    we_do: "query Azure Monitor's usage metrics daily — never your deployments, never your content (the Monitoring Reader role cannot)"
    create_hint: "register the app, add the role, collect the four values"
    step2_title: "Paste the four values here"
    step2_body: "We exchange them for a read-only token against Azure right away and show you exactly what we can see. Encrypted the moment they arrive, never written to a log, deleted the instant you revoke."
    honesty_note: "One honest limit, before you connect: Azure exposes no cached-token counts for standard deployments, so the cache detector reports 'not observable on Azure' rather than guessing."
    fields:
      - { name: tenant_id, label: "Directory (tenant) ID", placeholder: "00000000-0000-0000-0000-000000000000" }
      - { name: client_id, label: "Application (client) ID", placeholder: "00000000-0000-0000-0000-000000000000" }
      - { name: client_secret, label: "Client secret (the Value, not the ID)", placeholder: "paste the secret value", secret: true, full: true }
      - { name: resource_id, label: "Resource ID of your Azure OpenAI resource", placeholder: "/subscriptions/…/resourceGroups/…/providers/Microsoft.CognitiveServices/accounts/…", full: true }
    step3_title: "Connected — the platform takes it from here."
    step3_body: "We pull the last 30 days of metrics now, so your dashboard fills within minutes, then refresh your usage once a day. One honest limit, stated up front: Azure exposes no cached-token counts for standard deployments, so the cache detector reports 'not observable on Azure' rather than guessing."
  bedrock:
    # WP-CLOUD-T2 C-B. Verified against AWS docs (2026-07-23): AWS/Bedrock
    # CloudWatch namespace carries Invocations/InputTokenCount/
    # OutputTokenCount/CacheReadInputTokens/CacheWriteInputTokens by
    # ModelId. Read-only by IAM; unlike Azure, cache counts EXIST, so the
    # cache detector runs honestly here.
    provider_name: "AWS Bedrock"
    key_kind: "IAM access key with CloudWatch read-only permissions"
    step1_short: "Create a read-only IAM key in AWS"
    step2_short: "Paste its three values here"
    step1_title: "Grant us read-only eyes on your metrics — IAM enforces it"
    step1_body: "Bedrock publishes token and request counts as CloudWatch metrics. We read them with an IAM access key that holds exactly one permission set: CloudWatch read-only. Three minutes in the console:"
    step1_steps:
      - "IAM → Users → Create user. Name it (e.g. tokenops-cost-auditor-reader); no console access needed."
      - "Attach policies directly → CloudWatchReadOnlyAccess. (Or an inline policy allowing only cloudwatch:GetMetricData and cloudwatch:ListMetrics — tighter still.)"
      - "Security credentials → Create access key (choose Third-party service). Copy the Access key ID and the Secret access key now — AWS shows the secret once."
      - "Note the AWS region your Bedrock workloads run in (e.g. us-east-1) — metrics live in the region."
    console_url: "https://console.aws.amazon.com/iam/home#/users"
    console_label: "Open AWS's IAM Users page"
    console_note: "This opens AWS's real console at console.aws.amazon.com (IAM → Users). If it shows an error or an empty page: sign in to the AWS account that runs your Bedrock workloads first. Manual path once signed in: IAM → Users → Create user."
    missing_note: "Signed in but can't create IAM users or keys? Your account restricts IAM rights — ask whoever administers your AWS account to create the key."
    who_can: "Anyone with IAM user-management rights can create it."
    key_can: "read CloudWatch metrics in your account — token counts, request counts, cache reads and writes, by model"
    we_do: "query CloudWatch's Bedrock metrics daily — never your models, never your content (the read-only policy cannot)"
    create_hint: "create the user, attach the policy, create the access key"
    step2_title: "Paste the three values here"
    step2_body: "We run one read-only metrics query against CloudWatch right away and show you exactly what we can see. Encrypted the moment they arrive, never written to a log, deleted the instant you revoke."
    honesty_note: "One honest limit, before you connect: we price Anthropic Claude models on Bedrock at machine-verified rates; other Bedrock models (Nova, Llama, Mistral…) appear as unpriced — listed, never guessed — until their rates are verified too."
    fields:
      - { name: access_key_id, label: "Access key ID", placeholder: "AKIA…" }
      - { name: region, label: "Region", placeholder: "us-east-1" }
      - { name: secret_access_key, label: "Secret access key", placeholder: "paste the secret", secret: true, full: true }
    step3_title: "Connected — the platform takes it from here."
    step3_body: "We pull the last 30 days of metrics now, so your dashboard fills within minutes, then refresh your usage once a day. Bedrock exposes cache-read and cache-write counts, so the cache detector runs on this connection — the same coverage your report states plainly."
  vertex-ai:
    # WP-CLOUD-T2 C-C. Verified against Google Cloud docs + integration refs
    # (2026-07-23): Vertex publishes token counts to Cloud Monitoring
    # (aiplatform.googleapis.com/publisher/online_serving/token_count, split
    # input/output by model). Read-only by IAM; this metric has no cache
    # split, so d2 is "not observable on Vertex" (honest, like Azure).
    provider_name: "Google Vertex AI"
    key_kind: "service account with the Monitoring Viewer role"
    step1_short: "Create a read-only service account in Google Cloud"
    step2_short: "Paste its key JSON here"
    step1_title: "Grant us read-only eyes on your metrics — IAM enforces it"
    step1_body: "Vertex AI publishes token counts as Cloud Monitoring metrics. We read them with a service account you create, holding exactly one role: Monitoring Viewer, on your project. A few minutes in the console:"
    step1_steps:
      - "IAM & Admin → Service Accounts → Create service account. Name it (e.g. tokenops-cost-auditor-reader)."
      - "Grant it the role Monitoring Viewer (roles/monitoring.viewer) — nothing else."
      - "On the service account → Keys → Add key → Create new key → JSON. A key file downloads; keep it safe."
      - "Note your Google Cloud project ID (it is inside the key JSON as project_id) — the metrics live in the project."
    console_url: "https://console.cloud.google.com/iam-admin/serviceaccounts"
    console_label: "Open Google Cloud's Service Accounts page"
    console_note: "This opens Google Cloud's real console at console.cloud.google.com (Service Accounts). If it shows an error or the wrong project: sign in and pick the project your Vertex AI workloads run in. Manual path: IAM & Admin → Service Accounts → Create."
    missing_note: "Signed in but can't create a service account or key? Your project restricts it — ask a project IAM admin to create the read-only key for you."
    who_can: "Anyone with Service Account Admin + IAM permissions on the project can create it."
    key_can: "read Cloud Monitoring metrics on the project — token counts, by model"
    we_do: "query Cloud Monitoring's token metrics daily — never your models, never your content (the Monitoring Viewer role cannot)"
    create_hint: "create the service account, grant Monitoring Viewer, download the JSON key"
    step2_title: "Paste the key JSON here"
    step2_body: "We exchange it for a read-only token against Google right away and show you exactly what we can see. Encrypted the moment it arrives, never written to a log, deleted the instant you revoke."
    honesty_note: "One honest limit, before you connect: this Vertex metric splits input and output tokens only, not cached tokens, so the cache detector reports 'not observable on Vertex' rather than guessing."
    fields:
      - { name: service_account, label: "Service-account key JSON (paste the whole file)", placeholder: "{\n  \"type\": \"service_account\",\n  \"project_id\": \"…\",\n  \"private_key\": \"-----BEGIN PRIVATE KEY-----\\n…\",\n  \"client_email\": \"…@….iam.gserviceaccount.com\",\n  \"token_uri\": \"https://oauth2.googleapis.com/token\"\n}", textarea: true, secret: true, full: true }
    step3_title: "Connected — the platform takes it from here."
    step3_body: "We pull the last 30 days of metrics now, so your dashboard fills within minutes, then refresh your usage once a day. One honest limit, stated up front: the Vertex token metric splits input and output only, so cached-token savings show as 'not observable on Vertex' rather than a guess."
guide_pages:
  account-paths:
    title: "Individual or organization? Every account shape has a path"
    audience: "Both"
    body: "Connections read your provider's official usage reports, and providers gate those behind organization credentials — that constraint is theirs, not ours. Here is every shape and its path. OpenAI: every API account already has an organization; if you're its Owner, connect directly — otherwise ask your Owner for the Admin key, or upload meanwhile. Anthropic: an individual Console account has no Admin-keys page at all — create your organization under Settings → Organization (about a minute; you become its Admin) and connect; in someone else's org without the Admin role, ask your admin. Using Claude through a claude.ai plan (Pro or Max) with Claude Code? There is no API bill to pull — export your local transcripts with our one-command exporter instead, and your figures are labeled as API-equivalent value, because that is what they are. Chat-only accounts (ChatGPT or claude.ai without the API or Claude Code) have no usage we can read — we will say so rather than invent numbers. Azure OpenAI connects today: anyone with Owner or User Access Administrator on the resource grants us a read-only Monitoring Reader principal — the wizard walks the five portal steps. AWS Bedrock connects today too: a read-only IAM access key (CloudWatch metrics only — the wizard walks the console steps). Google Vertex AI connects today too: a read-only service account with the Monitoring Viewer role (the wizard walks the console steps). Gemini via Google AI Studio (non-Vertex) has no usage-pull API — upload its exports. And whatever your shape: uploading always works — zero keys, nothing to provision, the same six-detector audit."
  how-it-works:
    title: "How TokenOps works"
    audience: "Both"
    body: "Your usage comes in as a log file or a provider connection. We price every call against a rate card verified against independent published price data, run six deterministic detectors over it, and rank what they find by monthly dollars. You apply a fix; the next audit measures whether it worked. Nothing about that loop involves an AI judging your bill — it is arithmetic you can check."
  first-audit:
    title: "Your first audit"
    audience: "Owner"
    body: "Connect a provider for daily pulls, or upload a log export for the full six-detector audit. A connection backfills 30 days immediately, so you usually have numbers within minutes. Your first report ranks avoidable cost by dollars — start at the top."
  applying-findings:
    title: "Applying findings"
    audience: "Engineer"
    body: "Every finding carries why it was flagged with the exact thresholds used, the evidence rows behind it, a fix you can paste, and what your next audit will show if the fix works. Mark it Applied when it ships; the next audit covering at least 7 days recomputes the same route and moves the confirmed difference into verified savings."
  savings-statement:
    title: "Reading your Savings Statement"
    audience: "Owner"
    body: "One page, once a month: what you spent, what we found, what you fixed, and what that saved — with verified figures separated from estimates, and anything you reported yourself kept separate again. It is written to be forwarded to someone who never logs in here."
