; Cron sidecar config (runbook §1). Wired at D10. Schedules are 6-field Go cron
; (seconds first), all UTC. Containers are pinned by container_name in
; docker-compose.yml so job-exec targets survive compose scaling/renames.

[global]

; FR-21: purge raw uploads > PURGE_AFTER_DAYS old, daily 02:00 UTC
[job-exec "purge"]
schedule = 0 0 2 * * *
container = tokenops-cost-auditor-app
command = python -m tokenops_cost_auditor.services.lifecycle.purge

; NFR-08: pg_dump + reports snapshot + rotation, daily 02:30 UTC (runbook §4)
[job-exec "backup"]
schedule = 0 30 2 * * *
container = tokenops-cost-auditor-postgres
command = /bin/bash /scripts/backup.sh

; v1.5 WP-3a: hourly connector tick — daily pulls + weekly source audits
; (due-ness from last_*_at stamps; re-entrant, no-overlap)
[job-exec "connector-tick"]
schedule = 0 15 * * * *
container = tokenops-cost-auditor-app
command = python scripts/scheduler_tick.py
no-overlap = true

; runbook §3 business metrics + NFR-15 pricing age + FR-29 refresh failures +
; backup-absent >26h check, daily 03:00 UTC (after backup)
[job-exec "daily-digest"]
schedule = 0 0 3 * * *
container = tokenops-cost-auditor-app
command = python scripts/daily_digest.py
