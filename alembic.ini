[alembic]
script_location = src/tokenops_cost_auditor/persistence/migrations
prepend_sys_path = src
# Pin the separator: without it alembic falls back to legacy splitting on
# spaces/commas/colons and warns it will change. Deploy-time path parsing is
# not something to leave to a future default (V-D10 ship prep).
path_separator = os
# sqlalchemy.url is supplied at runtime from DATABASE_URL (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
propagate = 0
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
